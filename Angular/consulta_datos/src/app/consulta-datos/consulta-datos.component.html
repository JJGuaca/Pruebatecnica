
<div class="container my-3 py-3">
    <div class="row">
        <div class="col-12">
            <h3>Resultado del la consulta realizada</h3>
        </div>
    </div>
</div>
<div class="container">
    <div class="row">
        <div class="col-12">
            <div class="table-responsive">
                <table class="table table-hover table-bordered table-striped">
                    <thead>
                        <tr>
                            <th>Identificación</th>
                            <th>Nombre</th>
                            <th>correo electrónico</th>
                            <th>Genero</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of NusuariosLista;">
                            <td>{{item['id']}}</td>
                            <td>{{item['name']}}</td>
                            <td><a  class="link" target="_blank" href="mailto:{{item['email']}}"> {{item['email']}}</a></td>
                            <td>
                                @if(item['gender']=='female'){
                                    Femenino
                                }
                                @else{
                                    Masculino
                                }
                            </td>
                            <td>{{item['status']}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
